name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Run lint
        run: 'npm run lint'

  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Check formatting
        # Run `npm run format` locally to fix any failures.
        run: 'npm run format:check'

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Run build
        run: 'npm run build'

      - name: Verify package contents
        # Fails if any file listed in package.json "n8n" is missing from the
        # packed tarball, catching broken nodes/credentials paths before release.
        run: |
          npm pack --dry-run --json > pack.json
          node -e '
            const pkg = require("./package.json");
            const files = new Set(require("./pack.json")[0].files.map((f) => f.path));
            const missing = [...pkg.n8n.nodes, ...pkg.n8n.credentials].filter((p) => !files.has(p));
            if (missing.length) {
              console.error("Missing from package:", missing.join(", "));
              process.exit(1);
            }
            console.log(`Package contains ${files.size} files; all n8n entries present.`);
          '
